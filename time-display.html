<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time — Every Font</title>
  <style>
    @font-face { font-family: 'ALBAS'; src: url('src/assets/fonts/26fonts/26-10-27/ALBAS___.woff2') format('woff2'); }
    @font-face { font-family: 'BILLD'; src: url('src/assets/fonts/26fonts/26-10-27/BILLD___.woff2') format('woff2'); }
    @font-face { font-family: 'BUTTERFLY'; src: url('src/assets/fonts/26fonts/26-10-27/BUTTERFLY-Hollow.woff2') format('woff2'); }
    @font-face { font-family: 'BEASTMODE'; src: url('src/assets/fonts/26fonts/26-10-27/BeastMode-Doubleline.woff2') format('woff2'); }
    @font-face { font-family: 'BHARATIC'; src: url('src/assets/fonts/26fonts/26-10-27/Bharatic-Fontw.woff2') format('woff2'); }
    @font-face { font-family: 'BLACKLETTERSH'; src: url('src/assets/fonts/26fonts/26-10-27/Blacklettersh.woff2') format('woff2'); }
    @font-face { font-family: 'BROTHER_SIG'; src: url('src/assets/fonts/26fonts/26-10-27/Brother Signature.woff2') format('woff2'); }
    @font-face { font-family: 'COASTER'; src: url('src/assets/fonts/26fonts/26-10-27/CoasterShadow.woff2') format('woff2'); }
    @font-face { font-family: 'CUTE_DAYS'; src: url('src/assets/fonts/26fonts/26-10-27/Cute Days.woff2') format('woff2'); }
    @font-face { font-family: 'DISKO'; src: url('src/assets/fonts/26fonts/26-10-27/Disko_OT.woff2') format('woff2'); }
    @font-face { font-family: 'GLOREST'; src: url('src/assets/fonts/26fonts/26-10-27/GLOREST SHUFLE OUTLINE.woff2') format('woff2'); }
    @font-face { font-family: 'INDIA'; src: url('src/assets/fonts/26fonts/26-10-27/India Hair Style-Hollow.woff2') format('woff2'); }
    @font-face { font-family: 'NOE_LAND'; src: url('src/assets/fonts/26fonts/26-10-27/Noe Land-Demo.woff2') format('woff2'); }
    @font-face { font-family: 'PLEASE_SONG'; src: url('src/assets/fonts/26fonts/26-10-27/Please write me a song.woff2') format('woff2'); }
    @font-face { font-family: 'PLEATURES'; src: url('src/assets/fonts/26fonts/26-10-27/PleaturesDemo-Outline.woff2') format('woff2'); }
    @font-face { font-family: 'PULLSTAR'; src: url('src/assets/fonts/26fonts/26-10-27/Pullstar-Holinight.woff2') format('woff2'); }
    @font-face { font-family: 'SOVIET'; src: url('src/assets/fonts/26fonts/26-10-27/Soviet2e3Di.woff2') format('woff2'); }
    @font-face { font-family: 'SWEET_DUCK'; src: url('src/assets/fonts/26fonts/26-10-27/Sweet Duck Outline.woff2') format('woff2'); }
    @font-face { font-family: 'THEOUTLINE'; src: url('src/assets/fonts/26fonts/26-10-27/TheOutline-y4qq.woff2') format('woff2'); }
    @font-face { font-family: 'THESIGNATURE'; src: url('src/assets/fonts/26fonts/26-10-27/Thesignature.woff2') format('woff2'); }
    @font-face { font-family: 'BENZION3D'; src: url('src/assets/fonts/26fonts/26-10-27/benzion3d.woff2') format('woff2'); }
    @font-face { font-family: 'BENZION3DI'; src: url('src/assets/fonts/26fonts/26-10-27/benzion3di.woff2') format('woff2'); }
    @font-face { font-family: 'EGGROLL3DITAL'; src: url('src/assets/fonts/26fonts/26-10-27/eggroll3dital.woff2') format('woff2'); }
    @font-face { font-family: 'NYET3D'; src: url('src/assets/fonts/26fonts/26-10-27/nyet3d.woff2') format('woff2'); }
    @font-face { font-family: 'YAMAMOTO3D'; src: url('src/assets/fonts/26fonts/26-10-27/yamamoto3d.woff2') format('woff2'); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: monospace; padding: 2rem; }
    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .item { background: #222; border-radius: 8px; padding: 1.2rem; text-align: center; }
    .font-name { font-size: 0.7rem; opacity: 0.6; margin-bottom: 0.5rem; word-break: break-all; }
    .time { font-size: 3rem; font-weight: 400; }
  </style>
</head>
<body>
  <h1>Current Time — Every Font</h1>
  <div class="grid" id="grid"></div>
  <script>
    const fonts = [
      'ALBAS', 'BILLD', 'BUTTERFLY', 'BEASTMODE', 'BHARATIC',
      'BLACKLETTERSH', 'BROTHER_SIG', 'COASTER',
      'CUTE_DAYS', 'DISKO', 'GLOREST',
      'INDIA', 'NOE_LAND', 'PLEASE_SONG', 'PLEATURES',
      'PULLSTAR', 'SOVIET',
      'SWEET_DUCK', 'THEOUTLINE', 'THESIGNATURE',
      'BENZION3D', 'BENZION3DI', 'EGGROLL3DITAL',
      'NYET3D', 'YAMAMOTO3D'
    ];

    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const time = h + m + s;

      const grid = document.getElementById('grid');
      if (grid.children.length === 0) {
        fonts.forEach(font => {
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `
            <div class="font-name">${font}</div>
            <div class="time" style="font-family: ${font}, monospace;" id="time-${font}">--</div>
          `;
          grid.appendChild(item);
        });
      }

      fonts.forEach(font => {
        const el = document.getElementById('time-' + font);
        if (el) el.textContent = time;
      });
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
