name: "CI: Quality Gate"

# Stage 1 (hard gate) — tests + build + type-check + clock verification on changed pages.
# These MUST pass. They are the source of truth for "does the app work".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # HARD GATE: tests + build + type-check + verify changed clocks
  test-and-build:
    name: Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # scripts/verify-all-clocks.js --changed only ever diffs against
          # `origin/<base>...HEAD` (PRs) or `HEAD^` (push), and already
          # tolerates a shallow checkout that doesn't have the ref (see its
          # getChangedFiles() fallback). Full history (`fetch-depth: 0`) is
          # not required and re-downloads the entire (LFS-heavy) commit
          # history on every run. 50 is generous headroom for typical PR
          # sizes; raise it only if verification starts silently skipping
          # legitimate diffs. See docs/ROADMAP.md Phase 4.4.
          fetch-depth: 50

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify changed clock pages
        run: npm run verify:clocks:changed

      - name: Run unit tests
        run: npm run test:run

      - name: Type-check (in-scope code only, via tsconfig.ci.json)
        run: npm run type-check

      - name: Production build
        run: npm run build