<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- ✅ SEO Meta Tags -->
    <title>BorrowedTime @ Cubist Heart Laboratories</title>
    <meta name="description" content="BorrowedTime is a new clock every day." />
    <meta
      name="keywords"
      content="clock, art, BorrowedTime, Borrowed Time, Cubist Heart Laboratories,react, vite, design, visual, timepiece"
    />
    <meta name="author" content="Cubist Heart Laboratories" />

    <!-- ✅ Open Graph -->
    <meta
      property="og:title"
      content="BorrowedTime @ Cubist Heart Laboratories"
    />
    <meta property="og:description" content="A new clock every day." />
    <meta property="og:url" content="https://www.cubistheart.com/" />
    <meta property="og:type" content="website" />

    <!-- Google Analytics is injected at runtime (see src/analytics.ts) when env + DNT guards pass -->
    <script>
      // FOUC Prevention Strategy
      // ========================
      // 1. Immediately hide content
      // 2. Wait for fonts to load (with 3s hard timeout)
      // 3. Show content with fade-in transition
      //
      // This prevents the Flash of Unstyled Content (FOUC) that occurs
      // when web fonts load asynchronously after the initial render.

      document.documentElement.classList.add('fonts-loading');

      const showContent = () => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-ready');
      };

      // Hard timeout: never stay hidden longer than 3s
      const MAX_FONT_WAIT = 3000;
      const fontTimeout = setTimeout(showContent, MAX_FONT_WAIT);

      if ('fonts' in document) {
        document.fonts.ready
          .then(showContent)
          .catch(() => showContent())
          .finally(() => clearTimeout(fontTimeout));
      } else {
        // Fallback for older browsers: show content once the page loads
        window.addEventListener('load', () => {
          clearTimeout(fontTimeout);
          showContent();
        });
      }

      // Mark DOM as loaded for smooth transition
      document.addEventListener('DOMContentLoaded', () => {
        document.documentElement.classList.add('dom-loaded');
      });
    </script>
    <!-- Finger Paint (clock numeral font) -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap"
      rel="stylesheet"
    />

<style>
      /* Critical CSS: Prevent FOUC */
      .fonts-loading body {
        opacity: 0;
        visibility: hidden;
      }
      .fonts-ready body {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s ease-in;
      }
      /* Fallback: if DOM loaded but fonts aren't ready yet, still show content */
      .fonts-loading.dom-loaded body {
        opacity: 1;
        visibility: visible;
      }
      /* Ensure the root container is always visible */
      #root {
        min-height: 100dvh;
      }
    </style>
  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
