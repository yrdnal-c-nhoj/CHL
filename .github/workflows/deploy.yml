                                                            
                                                                                
   name: Deploy                                                                 
                                                                                
                                                                                
                                                                                
   on:                                                                          
                                                                                
     push:                                                                      
                                                                                
       branches:                                                                
                                                                                
         - main                                                                 
                                                                                
                                                                                
                                                                                
   jobs:                                                                        
                                                                                
     deploy:                                                                    
                                                                                
       runs-on: ubuntu-latest                                                   
                                                                                
                                                                                
                                                                                
       steps:                                                                   
                                                                                
         - name: Checkout code                                                  
                                                                                
           uses: actions/checkout@v3                                            
                                                                                
                                                                                
                                                                                
         - name: Set up Node.js                                                 
                                                                                
           uses: actions/setup-node@v3                                          
                                                                                
           with:                                                                
                                                                                
             node-version: '22.x'                                               
                                                                                
                                                                                
                                                                                
         - name: Install dependencies                                           
                                                                                
           run: npm ci                                                          
                                                                                
                                                                                
                                                                                
         - name: Build project                                                  
                                                                                
           run: npm run build                                                   
                                                                                
                                                                                
                                                                                
         - name: Deploy to Vercel                                               
                                                                                
           uses: vercel/actions/deploy@v1                                       
                                                                                
           with:                                                                
                                                                                
             vercel_token: ${{ secrets.VERCEL_TOKEN }}                          
                                                                                
             project_name: chl                            
                                                                                
             alias: chl-git-main-johns-projects-75897040.vercel.app