name: "CI: Lint & Verify Standards"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-standards:
    name: Verify Clock Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Clock Standards Verification
        run: node scripts/verify-all-clocks.js --no-color
        # The script exits with a non-zero code if violations are found,
        # which will automatically fail this CI step.
