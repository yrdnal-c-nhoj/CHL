name: "CI: Quality Gate"

# Layered CI designed to be *always useful* rather than *always red*.
#
# Stage 1 (hard gate)  — tests + build. These MUST pass. They are the source
#                        of truth for "does the app work".
# Stage 2 (no-new-debt) — lint + clock-standards verification. These compare
#                        against a committed baseline (.github/compliance-baseline.json)
#                        and FAIL ONLY IF THEY REGRESS. This lets the team work
#                        down the existing debt (491 legacy clocks) without a
#                        permanently-red pipeline, while guaranteeing new code
#                        does not add to it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # STAGE 1 — HARD GATE: tests + build (must always be green)
  # ---------------------------------------------------------------
  test-and-build:
    name: Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Type-check app code (non-blocking)
        # Full `tsc` currently surfaces ~3,100 pre-existing type errors in the
        # legacy clock pages (src/pages/**/Clock.tsx). Those are tracked as debt
        # and migrated in phases. We run type-check here and surface results as
        # a warning so the hard gate stays green while the fleet is being fixed.
        # The Vite/esbuild build below is the real "does it compile" gate.
        continue-on-error: true
        run: |
          npx tsc --noEmit -p tsconfig.ci.json --skipLibCheck \
            || echo "::warning::Type-check reported errors (see log). This is non-blocking while legacy clock pages are being migrated."

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------
  # STAGE 2 — NO-NEW-DEBT GATE: lint + clock standards (regression-only)
  # ---------------------------------------------------------------
  verify-standards:
    name: Clock Standards (no new debt)
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run clock standards verifier (CSV)
        run: node scripts/verify-all-clocks.js --no-color --csv clocks-report.csv
        continue-on-error: true # capture violation counts; we compare below

      - name: Check compliance did not regress
        env:
          BASELINE: ${{ github.workspace }}/.github/compliance-baseline.json
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE, "utf8")).baselines;

            const csv = "clocks-report.csv";
            if (!fs.existsSync(csv)) {
              console.error("❌ No clocks-report.csv found — verifier did not run.");
              process.exit(1);
            }
            const lines = fs.readFileSync(csv, "utf8").trim().split("\n").slice(1);
            const totalClocks = lines.length;
            const totalViolations = lines.reduce((sum, l) => sum + parseInt(l.split(",")[2] || "0", 10), 0);

            // Count CLOCKS with critical violations from the CSV prohibited columns.
            // Columns: date,path,violations, [10 rules idx 3..12],
            //          [5 prohibited idx 13..17: set-interval, inline-style,
            //           enhanced-font-loader, no-assets, to-locale]
            // A clock has a critical violation if it uses setInterval (col 13).
            let critical = 0;
            for (const l of lines) {
              const cols = l.split(",");
              if (cols[13] === "1") critical++;
            }

            const regressed = [];
            if (totalViolations > baseline.totalViolations) {
              regressed.push(`totalViolations ${totalViolations} > baseline ${baseline.totalViolations}`);
            }
            if (critical > baseline.criticalViolations) {
              regressed.push(`criticalViolations ${critical} > baseline ${baseline.criticalViolations}`);
            }

            console.log(`\nClock standards summary:`);
            console.log(`  totalClocks:        ${totalClocks}   (baseline ${baseline.totalClocks})`);
            console.log(`  totalViolations:    ${totalViolations}   (baseline ${baseline.totalViolations})`);
            console.log(`  criticalViolations: ${critical}   (baseline ${baseline.criticalViolations})`);

            if (regressed.length) {
              console.error(`\n❌ Compliance REGRESSED: ${regressed.join("; ")}`);
              process.exit(1);
            }
            console.log(`\n✅ No new debt. (Meeting or improving baseline. Aim to reduce next.)`);
          '

      - name: Run lint (regression-only)
        env:
          LINT_BASELINE: ${{ github.workspace }}/.github/compliance-baseline.json
        run: |
          set -euo pipefail
          set +e
          npm run lint > /tmp/lint.out 2>&1
          set -e
          LINT_ERRORS=$(grep -oE "[0-9]+ errors" /tmp/lint.out | grep -oE "[0-9]+" | head -1 || echo "0")
          echo "Lint errors: ${LINT_ERRORS:-0}"
          tail -5 /tmp/lint.out
          node -e '
            const fs = require("fs");
            const b = JSON.parse(fs.readFileSync(process.env.LINT_BASELINE, "utf8")).baselines;
            const cur = parseInt(process.env.LINT_ERRORS || "0", 10);
            if (cur > b.lintVulnerabilities) {
              console.error(`❌ Lint errors regressed: ${cur} > baseline ${b.lintVulnerabilities}`);
              process.exit(1);
            }
            console.log(`✅ Lint errors within baseline (goal ≤ ${b.lintVulnerabilities}).`);
          '

      - name: Upload clock standards report
        uses: actions/upload-artifact@v4
        with:
          name: clocks-report
          path: clocks-report.csv
          if-no-files-found: warn
